- op: add
  path: /spec/config/processors/metricstransform~1rename
  value:
    transforms:
      - include: system.cpu.load_average.15m
        action: update
        new_name: groundcover_host_cpu_load_avg15
      - include: system.cpu.load_average.1m
        action: update
        new_name: groundcover_host_cpu_load_avg1m
      - include: system.cpu.load_average.5m
        action: update
        new_name: groundcover_host_cpu_load_avg5m
- op: add
  path: /spec/config/processors/attributes~1env
  value:
    actions:
      - key: env_type
        value: "k8s"
        action: insert
- op: add
  path: /spec/config/service/pipelines/metrics/processors/1
  value: metricstransform/rename
- op: add
  path: /spec/config/service/pipelines/metrics/processors/1
  value: attributes/env
- op: add
  path: /spec/config/service/pipelines/logs/processors/1
  value: attributes/env
- op: add
  path: /spec/config/service/pipelines/traces/processors/1
  value: attributes/env