apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otelcol-ds
spec:
  mode: daemonset
  terminationGracePeriodSeconds: 600
  hostNetwork: true
  image: otel/opentelemetry-collector-k8s:0.139.0
  serviceAccount: opentelemetry-collector
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  ports:  
    - name: metrics
      port: 8888
      hostPort: 8888
      protocol: TCP
      targetPort: 8888
    - name: otlp-grpc
      port: 4317
      hostPort: 4317
      protocol: TCP
      targetPort: 4317
    - name: otlp-http
      port: 4318
      hostPort: 4318
      protocol: TCP
      targetPort: 4318
    - name: envoyals
      port: 4319
      hostPort: 4319
      protocol: TCP
      targetPort: 4319
  volumeMounts:
    - name: hostfs
      mountPath: /hostfs
      readOnly: true
      mountPropagation: HostToContainer
  volumes:
    - name: hostfs
      hostPath:
        path: /
  config:
    receivers:
      # Receive metrics from the Envoy Access Log Service
      # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/envoyalsreceiver
      # https://gateway.envoyproxy.io/v1.5/tasks/observability/proxy-accesslog/#ggrpc-access-log-serviceals-sink
      # Needs custom otelcollector image with the envoyalsreceiver included
      # https://github.com/open-telemetry/opentelemetry-collector/tree/main/cmd/builder
      # envoyals:
      #   endpoint: 0.0.0.0:4319
      hostmetrics:
        root_path: /hostfs
        scrapers:
          # cpu:
          # disk:
          # filesystem:
          load:
          # memory:
          # network:
          # process:
          # processes:
          # paging:
      kubeletstats:
        collection_interval: 10s
        auth_type: 'serviceAccount'
        endpoint: '${env:K8S_NODE_NAME}:10250'
        insecure_skip_verify: true
        metric_groups:
          - node
          - pod
          - container
      otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      resourcedetection/system:
        detectors: [k8snode, docker, system]
        system:
          hostname_sources: ["os"]
          resource_attributes:
            host.arch:
              enabled: true
            host.cpu.cache.l2.size:
              enabled: false
            host.cpu.family:
              enabled: false
            host.cpu.model.id:
              enabled: false
            host.cpu.model.name:
              enabled: true
            host.cpu.stepping:
              enabled: false
            host.cpu.vendor.id:
              enabled: false
            host.id:
              enabled: false
            host.interface:
              enabled: false
            host.ip:
              enabled: false
            host.mac:
              enabled: false
            host.name:
              enabled: false
            os.build.id:
              enabled: true
            os.description:
              enabled: false
            os.name:
              enabled: false
            os.version:
              enabled: false
            os.type:
              enabled: true
        k8snode:
          resource_attributes:
            k8s.node.name:
              enabled: true
            k8s.node.uid:
              enabled: false
      k8sattributes:
        auth_type: 'serviceAccount'
        extract:
          metadata: # extracted from the pod
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.start_time
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.node.name
        pod_association: # How to associate the data to a pod (order matters)
          - sources: # First try to use the value of the resource attribute k8s.pod.ip
              - from: resource_attribute
                name: k8s.pod.ip
          - sources: # Then try to use the value of the resource attribute k8s.pod.uid
              - from: resource_attribute
                name: k8s.pod.uid
          - sources: # If neither of those work, use the request's connection to get the pod IP.
              - from: connection


    exporters:
      debug:
        verbosity: detailed

    service:
      pipelines:
        metrics:
          receivers: [otlp, hostmetrics]
          # receivers: [otlp, hostmetrics, kubeletstats]
          # Need custom otelcollector image with the envoyalsreceiver included to enable this
          # receivers: [kubeletstats, otlp, hostmetrics,  envoyals]
          processors: [resourcedetection/system, k8sattributes, memory_limiter]
          exporters: [debug]
        logs:
          receivers: [otlp]
          # receivers: [otlp, hostmetrics,  envoyals]
          processors: [ resourcedetection/system, k8sattributes, memory_limiter]
          exporters: [debug]
        traces:
          receivers: [otlp]
          # receivers: [otlp, hostmetrics,  envoyals]
          processors: [resourcedetection/system, k8sattributes, memory_limiter]
          exporters: [debug]