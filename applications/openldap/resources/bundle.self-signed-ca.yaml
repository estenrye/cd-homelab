apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: self-signed-ca
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        name: selfsigned-ca
        key: ca.crt
  target:
    configMap:
      key: root-certs.pem
    additionalFormats:
      jks:
        key: bundle.jks
      pkcs12:
        key: bundle.p12
    namespaceSelector:
      matchLabels:
        rye.ninja/ldap-trust-enabled: "true"