version: '2'

networks:
  my-network:
    driver: bridge
services:
  openldap:
    image: bitnami/openldap:latest
    ports:
      - '1389:1389'
      - '1636:1636'
    environment:
      BITNAMI_DEBUG: yes
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: adminpassword
      LDAP_SKIP_DEFAULT_TREE: yes
      # LDAP_CUSTOM_SCHEMA_FILE: /etc/schemas.ldif
      LDAP_CUSTOM_LDIF_DIR: /ldifs
      LDAP_ROOT: dc=rye,dc=ninja
      LDAP_ADMIN_DN: cn=admin,dc=rye,dc=ninja
      LDAP_LOGLEVEL: 256
    networks:
      - my-network
    volumes:
      # - 'openldap_data:/bitnami/openldap'
      - ./resources/ldif:/ldifs
# volumes:
#   openldap_data:
#     driver: local