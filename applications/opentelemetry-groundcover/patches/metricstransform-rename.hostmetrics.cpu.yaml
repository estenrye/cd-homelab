- op: add
  path: /spec/config/processors/transform~1metrics/metric_statements/-
  value:
    context: metric
    statements:
      - copy_metric(name="groundcover_host_cpu_idle_spent_percent", description="Percentage of CPU time spent idle") where metric.name == "system.cpu.utilization_percent"
      - copy_metric(name="groundcover_host_cpu_interrupt_spent_percent", description="Percentage of CPU time spent handling interrupts") where metric.name == "system.cpu.utilization_percent"
      - copy_metric(name="groundcover_host_cpu_nice_spent_percent", description="Percentage of CPU time spent on niced processes") where metric.name == "system.cpu.utilization_percent"
      - copy_metric(name="groundcover_host_cpu_softirq_spent_percent", description="Percentage of CPU time spent handling software interrupts") where metric.name == "system.cpu.utilization_percent"
      - copy_metric(name="groundcover_host_cpu_steal_spent_percent", description="Percentage of CPU time stolen by the hypervisor") where metric.name == "system.cpu.utilization_percent"
      - copy_metric(name="groundcover_host_cpu_system_spent_percent", description="Percentage of CPU time spent in system mode") where metric.name == "system.cpu.utilization_percent"
      - copy_metric(name="groundcover_host_cpu_user_spent_percent", description="Percentage of CPU time spent in user mode") where metric.name == "system.cpu.utilization_percent"
      - copy_metric(name="groundcover_host_cpu_iowait_spent_percent", description="Percentage of CPU time spent waiting for I/O") where metric.name == "system.cpu.utilization_percent"
      - copy_metric(name="groundcover_host_cpu_num_cores", description="Number of CPU cores on the host") where metric.name == "system.cpu.logical.count"
- op: add
  path: /spec/config/processors/filter~1ottl/metrics/datapoint/-
  value: metric.name == "groundcover_host_cpu_idle_spent_percent" and attributes["state"] != "idle"
- op: add
  path: /spec/config/processors/filter~1ottl/metrics/datapoint/-
  value: metric.name == "groundcover_host_cpu_interrupt_spent_percent" and attributes["state"] != "interrupt"
- op: add
  path: /spec/config/processors/filter~1ottl/metrics/datapoint/-
  value: metric.name == "groundcover_host_cpu_nice_spent_percent" and attributes["state"] != "nice"
- op: add
  path: /spec/config/processors/filter~1ottl/metrics/datapoint/-
  value: metric.name == "groundcover_host_cpu_softirq_spent_percent" and attributes["state"] != "softirq"
- op: add
  path: /spec/config/processors/filter~1ottl/metrics/datapoint/-
  value: metric.name == "groundcover_host_cpu_steal_spent_percent" and attributes["state"] != "steal"
- op: add
  path: /spec/config/processors/filter~1ottl/metrics/datapoint/-
  value: metric.name == "groundcover_host_cpu_user_spent_percent" and attributes["state"] != "user"
- op: add
  path: /spec/config/processors/filter~1ottl/metrics/datapoint/-
  value: metric.name == "groundcover_host_cpu_iowait_spent_percent" and attributes["state"] != "wait"
- op: add
  path: /spec/config/processors/filter~1ottl/metrics/datapoint/-
  value: metric.name == "groundcover_host_cpu_system_spent_percent" and attributes["state"] != "system"
