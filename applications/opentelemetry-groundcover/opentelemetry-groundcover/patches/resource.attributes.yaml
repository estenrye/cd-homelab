- op: add
  path: /spec/config/processors/resource/attributes/-
  value:
    key: env_type
    value: "k8s"
    action: insert

- op: add
  path: /spec/config/processors/transform~1logs/log_statements/-
  value: replace_all_patterns(resource.attributes, "key", "k8s\\.namespace\\.name",
      "namespace")
- op: add
  path: /spec/config/processors/transform~1logs/log_statements/-
  value: set(resource.attributes["pod_name"], resource.attributes["k8s.pod.name"])
- op: add
  path: /spec/config/processors/transform~1logs/log_statements/-
  value: replace_all_patterns(resource.attributes, "key", "k8s\\.pod\\.name", "pod")
- op: add
  path: /spec/config/processors/transform~1logs/log_statements/-
  value: set(resource.attributes["node_name"], resource.attributes["k8s.node.name"])
- op: add
  path: /spec/config/processors/transform~1logs/log_statements/-
  value: replace_all_patterns(resource.attributes, "key", "k8s\\.node\\.name", "node")
- op: add
  path: /spec/config/processors/transform~1logs/log_statements/-
  value: replace_all_patterns(resource.attributes, "key", "k8s\\.deployment\\.name",
      "workload")
- op: add
  path: /spec/config/processors/transform~1logs/log_statements/-
  value: replace_all_patterns(resource.attributes, "key", "k8s\\.statefulset\\.name",
      "workload")
- op: add
  path: /spec/config/processors/transform~1logs/log_statements/-
  value: replace_all_patterns(resource.attributes, "key", "k8s\\.daemonset\\.name",
      "workload")
- op: add
  path: /spec/config/processors/transform~1logs/log_statements/-
  value: delete_key(resource.attributes, "k8s.pod.uid")
- op: add
  path: /spec/config/processors/transform~1logs/log_statements/-
  value: delete_key(resource.attributes, "k8s.pod.start_time")
