apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  hostnames:
    - 'grpc.argocd.${K_INFRA_NAME}.${K_ZONE_NAME}'
  parentRefs:
    - name: eg-argocd
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          port: 443
          weight: 1