---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: netdata-claim-token
  namespace: netdata
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
  data:
  - secretKey: NETDATA_CLAIM_TOKEN
    remoteRef:
      key: netdata-claim-token
      property: credential
      conversionStrategy: Default	
      decodingStrategy: None
      metadataPolicy: None
