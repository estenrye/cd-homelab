apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
spec:
  db:
    database: app
    host: postgres-rw.keycloak
    vendor: postgres
    userNameSecret:
      name: postgres-app
      key: username
    passwordSecret:
      name: postgres-app
      key: password
  http:
    httpEnabled: true
    tlsSecret: keycloak-tls
  hostname: keycloak.${K_INFRA_NAME}.${K_ZONE_NAME}
