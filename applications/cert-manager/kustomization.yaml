apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - resources/namespace.yaml
  # - resources/operator_group.yaml
  # - resources/subscription.yaml
  # - resources/podmonitor.yaml

helmCharts:
  - name: cert-manager
    namespace: cert-manager
    repo: oci://quay.io/jetstack/charts
    version: v1.19.1
    releaseName: cert-manager
    includeCRDs: true
    valuesInline: {}
    valuesFile: values.yaml
